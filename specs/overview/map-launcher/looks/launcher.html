<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Map launcher — design</title><style>:root{--ground:#ECEEF3;--sheet:#FFFFFF;--edge:#DDE0E8;--pill:#F3F4F8;--text:#17171C;--text-2:#50515C;--text-3:#676875;--accent:#5B5BD6;--accent-text:#4646C0;--accent-soft:#E7E7FA;--on-accent:#FFFFFF;--wait-bg:#FEF3C7;--req-bg:#FEEFE3;--body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,'Cascadia Mono','SF Mono',Consolas,monospace;color-scheme:light}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#111216;--sheet:#1A1B21;--edge:#2D2F37;--pill:#23242B;--text:#F2F2F5;--text-2:#A8A9B5;--text-3:#91929E;--accent:#5B5BD6;--accent-text:#ABABF8;--accent-soft:#27274A;--on-accent:#FFFFFF;--wait-bg:#3A2C0E;--req-bg:#3B2112;color-scheme:dark}}:root[data-theme="dark"]{--ground:#111216;--sheet:#1A1B21;--edge:#2D2F37;--pill:#23242B;--text:#F2F2F5;--text-2:#A8A9B5;--text-3:#91929E;--accent:#5B5BD6;--accent-text:#ABABF8;--accent-soft:#27274A;--on-accent:#FFFFFF;--wait-bg:#3A2C0E;--req-bg:#3B2112;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--ground);color:var(--text);font:13.5px/1.45 var(--body)}button,input,textarea{font:inherit;color:inherit}:focus-visible,.fv{outline:3px solid var(--accent);outline-offset:2px}a{color:var(--accent-text);text-decoration:none}.mono{font-family:var(--mono);font-size:.86em}.f{color:var(--text-3);font-size:12px}.sp{flex:1}
section{margin:0 0 24px}.app{position:relative;display:flex;flex-direction:column;background:var(--ground);border:1px solid var(--edge);border-radius:12px;overflow:hidden}.app>*{flex:none}.w700{max-width:700px}.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}h2{font-size:22px;line-height:1.25;margin:0;font-weight:800}h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:20px 0 8px}
.s-top{min-height:52px;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--sheet);border-bottom:1px solid var(--edge);flex-wrap:wrap}.s-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}.s-brand i{width:18px;height:18px;border-radius:5px;background:var(--accent)}.s-chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;background:var(--pill);color:var(--text-2);font-size:12px}.repo{display:inline-flex;height:20px;align-items:center;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent-text)}.s-search{width:200px;height:30px;border-radius:7px;border:1px solid var(--edge);background:var(--pill);padding:0 10px;font-size:12.5px}
.s-btn{min-height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--edge);background:var(--sheet);font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer}.s-btn.pr{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.s-btn.i{width:30px;padding:0;justify-content:center}.s-btn.sm{min-height:28px;padding:0 10px}.s-btn.i.sm{width:28px}
.s-tabs{height:42px;display:flex;gap:4px;padding:0 16px;background:var(--sheet);border-bottom:1px solid var(--edge)}.s-tab{padding:0 12px;font-weight:600;color:var(--text-2);border:0;border-bottom:2px solid transparent;background:none;display:flex;gap:6px;align-items:center}.s-tab.on{color:var(--text);border-color:var(--accent)}.n{font-size:11.5px;background:var(--pill);border-radius:999px;padding:0 7px;color:var(--text-2);font-weight:600}
.banner{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--wait-bg);border-bottom:1px solid var(--edge);font-size:13px}.banner.q{background:var(--req-bg)}.banner .bt{flex:1}</style></head><body>
<section id="restart-update" aria-label="A newer map is on main: Restart to update"><div class="app"><header class="s-top"><span class="s-brand"><i></i>Solution map</span><span class="s-chip"><span class="repo">app</span><b class="mono">3f2a9c1</b></span><span class="s-chip"><span class="repo">api</span><b class="mono">8b41d07</b></span><span class="sp"></span><span class="f">built 18 Nov, 15:10</span><button class="s-btn">↻ Refresh</button><input class="s-search" type="search" placeholder="Search features   /" aria-label="Search features"><button class="s-btn i" aria-label="Light or dark">◐</button></header><div class="banner" role="status"><span class="bt">A newer map is on main.</span><button class="s-btn">Restart to update</button></div><nav class="s-tabs"><button class="s-tab on" aria-current="page">Waiting for you <span class="n">6</span></button><button class="s-tab">Explore <span class="n">10</span></button><button class="s-tab">Backlog <span class="n">7</span></button></nav></div></section>
</body></html>
